name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: node --check server.js && node --check lib/portscan.js && node --check scripts/smoke.js && node --check scripts/vendor-assets.js
      - name: Frontend JSX compile check
        run: node -e "
          const fs=require('fs'),Babel=require('@babel/standalone');
          const html=fs.readFileSync('public/index.html','utf8');
          const m=html.match(/<script type=\"text\/babel\" data-presets=\"react\">([\s\S]*?)<\/script>/);
          if(!m){console.error('babel block missing');process.exit(1);}
          Babel.transform(m[1],{presets:['react']});
          console.log('JSX transform OK');
          "
      - name: Run API smoke tests
        run: node scripts/smoke.js
        env:
          SERVER_PORT: '33123'