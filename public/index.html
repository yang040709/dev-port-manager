<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dev Port Manager · 端口管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d232e; --border: #262c39;
    --text: #e6eaf2; --muted: #8b93a7;
    --green: #3ddc84; --red: #ff5c5c; --amber: #ffb020; --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }

  /* 顶栏 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 30px; }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .sub .updated { margin-left: 10px; }

  .stats { display: flex; gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 14px; text-align: center; min-width: 74px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat.occ b { color: var(--red); }
  .stat.free b { color: var(--green); }

  /* 工具栏 */
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .select-label { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  select, .add input {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  select:focus, .add input:focus { border-color: var(--accent); }
  .add { display: flex; gap: 8px; margin-left: auto; }
  .add input { width: 150px; }

  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    transition: filter .15s, border-color .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { border-color: rgba(255,92,92,.55); color: var(--red); }
  .btn.danger:hover:not(:disabled) { background: rgba(255,92,92,.1); border-color: var(--red); }
  .btn.small { padding: 3px 10px; font-size: 12px; }
  .btn.ghost { color: var(--muted); }
  .lang-btn {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .lang-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(76,141,255,.08); }
  .spin { display: inline-block; }
  .spin.on { animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* 表格 */
  .ptable { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .ptable th {
    text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel2);
  }
  .ptable td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .ptable tr:last-child td { border-bottom: none; }
  .ptable tr:hover td { background: rgba(76,141,255,.04); }
  .port { font-size: 18px; font-weight: 700; color: var(--accent); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.free { background: rgba(61,220,132,.12); color: var(--green); border: 1px solid rgba(61,220,132,.4); }
  .badge.occ { background: rgba(255,92,92,.12); color: var(--red); border: 1px solid rgba(255,92,92,.4); }

  .proc-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proc-item + .proc-item { margin-top: 4px; }
  .proc-item .mono { font-size: 13px; font-weight: 600; }
  .pid { color: var(--amber); font-size: 12px; background: rgba(255,176,32,.1); padding: 1px 6px; border-radius: 6px; }
  .cmdline { color: var(--muted); font-size: 11px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); }
  .ops { white-space: nowrap; }
  .ops .btn { margin-right: 6px; }

  .empty { background: var(--panel); border: 1px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; color: var(--muted); }

  .foot { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  .foot em { color: var(--text); font-style: normal; }

  /* toast */
  .toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 420px;
    padding: 12px 16px; border-radius: 10px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 99;
    animation: slideIn .25s ease;
  }
  .toast.success { border-left: 4px solid var(--green); }
  .toast.error { border-left: 4px solid var(--red); }
  @keyframes slideIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="/vendor/react/react.development.js"></script>
<script src="/vendor/react-dom/react-dom.development.js"></script>
<script src="/vendor/babel/babel.min.js"></script>

<script>
/* 加载失败自诊断：任何运行时脚本缺失时给出可见提示，而不是控制台里裸的 ReferenceError（跟随语言偏好） */
(function () {
  var missing = [];
  if (typeof React === 'undefined') missing.push('/vendor/react/react.development.js');
  if (typeof ReactDOM === 'undefined') missing.push('/vendor/react-dom/react-dom.development.js');
  if (typeof Babel === 'undefined') missing.push('/vendor/babel/babel.min.js');
  if (missing.length) {
    var isEn = false;
    try { isEn = localStorage.getItem('dpm_lang') === 'en'; } catch (e) {}
    var L = isEn
      ? { head: '⚠ Page assets failed to load',
          lead: 'The following assets could not be loaded (404 / network error / stale cache): ',
          s1: 'Open <b>http://localhost:3081</b> directly — not via a proxy or preview pane;<br/>',
          s2: 'Hard-refresh with <b>Ctrl+F5</b> (Cmd+Shift+R on macOS) to clear the stale cache;<br/>',
          s3: 'For a manually copied copy, re-run <b>npm install</b> in the project directory, then restart the server.' }
      : { head: '⚠ 页面脚本加载失败',
          lead: '以下资源未能加载（404 / 网络错误 / 缓存过期）：',
          s1: '直接访问 <b>http://localhost:3081</b>，不要通过代理或预览窗口打开；<br/>',
          s2: '按 <b>Ctrl+F5</b>（Mac 为 Cmd+Shift+R）强制刷新，清除旧缓存；<br/>',
          s3: '若为手工复制的副本，在项目目录重新执行 <b>npm install</b> 重建前端资源，再重启服务。' };
    var joiner = isEn ? ', ' : '、';
    document.getElementById('root').innerHTML =
      '<div style="max-width:540px;margin:60px auto;padding:24px;border:1px solid rgba(255,92,92,.5);' +
      'border-radius:12px;background:#171a21;color:#e6eaf2;font:14px/1.8 system-ui,-apple-system,sans-serif;">' +
      '<b style="color:#ff5c5c;font-size:15px;">' + L.head + '</b><br/>' +
      L.lead + '<b>' + missing.join(joiner) + '</b><br/>' +
      L.s1 + L.s2 + L.s3 +
      '</div>';
    if (window.console) console.error('page assets failed to load:', missing);
  }
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- i18n 词典 ---------- */
const I18N = {
  zh: {
    title: 'Dev Port Manager · 端口管理',
    langToggle: 'English',
    subFallback: '本地开发端口管理',
    subUpdated: '上次检测 {time}',
    statTotal: '总端口', statOccupied: '占用中', statFree: '空闲',
    btnRefresh: '手动刷新', btnAdd: '+ 添加端口',
    btnStop: '停止进程', btnStopping: '终止中…', btnDelete: '删除',
    btnDeleteTitle: '从列表移除（不影响进程）',
    labelAuto: '自动刷新',
    optOff: '关闭', opt3: '每 3 秒', opt5: '每 5 秒', opt10: '每 10 秒',
    inputPlaceholder: '输入端口号，如 6001',
    emptyChecking: '正在检测端口状态…', emptyAdd: '列表为空，请在上方输入端口号添加',
    thPort: '端口', thStatus: '状态', thProcess: '占用进程', thAction: '操作',
    badgeOcc: '占用', badgeFree: '空闲',
    cmdlineTitle: '命令行: {cmd}',
    confirmRemove: '确定从列表移除端口 {port} 吗？（仅移除监控，不影响其进程）',
    confirmKill: '确定终止占用端口 {port} 的进程吗？\n（先尝试优雅退出 SIGTERM，必要时强制 SIGKILL）',
    toastTimeout: '刷新失败：请求超时',
    toastRefresh: '刷新失败：{msg}',
    toastInvalid: '请输入有效的端口号（1–65535）',
    toastAdded: '端口 {port} 已添加',
    toastAddFail: '添加失败：{msg}',
    toastRemoved: '端口 {port} 已从列表移除',
    toastDeleteFail: '删除失败：{msg}',
    toastReleased: '端口 {port} 已释放',
    toastKillFail: '无法终止端口 {port} 的进程',
    toastOpFail: '操作失败：{msg}',
    killStill: '端口 {port} 仍被进程占用：{still}。该进程可能是系统服务或无权限终止，请以管理员/root 身份运行本工具后重试，或手动处理。',
    selfProtect: '端口 {port} 正被本工具自身占用，已自动跳过终止',
    footA: '提示：占用检测基于 ', footB: '，进程名与命令行来自 ', footC: '。停止进程先发 SIGTERM（优雅退出），Windows 下为强制终止；无权限终止时会给出明确错误提示。系统服务类进程（如 sshd、svchost）通常无法被普通权限终止，属正常现象。',
    footD: '自定义端口列表保存在项目目录下的 ports.json，可手工编辑，重启后生效。',
  },
  en: {
    title: 'Dev Port Manager · Port Manager',
    langToggle: '中文',
    subFallback: 'Local dev port manager',
    subUpdated: 'Last checked {time}',
    statTotal: 'Total', statOccupied: 'Occupied', statFree: 'Free',
    btnRefresh: 'Refresh', btnAdd: '+ Add port',
    btnStop: 'Stop process', btnStopping: 'Stopping…', btnDelete: 'Remove',
    btnDeleteTitle: 'Remove from list (process untouched)',
    labelAuto: 'Auto refresh',
    optOff: 'Off', opt3: 'Every 3 s', opt5: 'Every 5 s', opt10: 'Every 10 s',
    inputPlaceholder: 'Port number, e.g. 6001',
    emptyChecking: 'Checking port status…', emptyAdd: 'List is empty — add a port above',
    thPort: 'Port', thStatus: 'Status', thProcess: 'Process', thAction: 'Actions',
    badgeOcc: 'Occupied', badgeFree: 'Free',
    cmdlineTitle: 'Command: {cmd}',
    confirmRemove: 'Remove port {port} from the list? (monitoring only — the process is untouched)',
    confirmKill: 'Terminate the process holding port {port}?\n(SIGTERM first, SIGKILL escalation if needed)',
    toastTimeout: 'Refresh failed: request timed out',
    toastRefresh: 'Refresh failed: {msg}',
    toastInvalid: 'Enter a valid port number (1–65535)',
    toastAdded: 'Port {port} added',
    toastAddFail: 'Failed to add: {msg}',
    toastRemoved: 'Port {port} removed from the list',
    toastDeleteFail: 'Failed to remove: {msg}',
    toastReleased: 'Port {port} released',
    toastKillFail: 'Could not terminate the process on port {port}',
    toastOpFail: 'Operation failed: {msg}',
    killStill: 'Port {port} is still held by: {still}. It may be a system service or require elevated permissions — retry as admin/root or handle manually.',
    selfProtect: 'Port {port} is held by this tool itself — termination skipped automatically',
    footA: 'Detection relies on ', footB: '; process names & command lines come from ', footC: '. Termination sends SIGTERM first (forced on Windows); permission failures are reported clearly. System services (e.g. sshd, svchost) usually cannot be killed by a normal user — that is expected.',
    footD: 'Custom ports are stored in ports.json in the project directory — editable by hand, takes effect on restart.',
  },
};

function App() {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem('dpm_lang') === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; }
  });
  const [ports, setPorts] = useState([]);
  const [server, setServer] = useState(null);
  const [loading, setLoading] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [auto, setAuto] = useState('0');           // 自动刷新间隔（秒），'0' = 关闭
  const [newPort, setNewPort] = useState('');
  const [busyPort, setBusyPort] = useState(null);  // 正在终止的端口
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  const toastTimer = useRef(null);

  const t = useCallback((key, vars) => {
    let s = (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
    if (vars) for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(v);
    return s;
  }, [lang]);

  // 语言偏好持久化 + 页面标题
  useEffect(() => {
    try { localStorage.setItem('dpm_lang', lang); } catch (e) {}
    document.title = t('title');
  }, [lang, t]);

  const showToast = useCallback((type, text) => {
    setToast({ type, text, key: Date.now() });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), type === 'error' ? 9000 : 5000);
  }, []);

  const fetchPorts = useCallback(async ({ silent = false } = {}) => {
    if (silent) setRefreshing(true); else setLoading(true);
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch('/api/ports', { signal: ctrl.signal });
      clearTimeout(tm);
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.error) || 'HTTP ' + res.status);
      setPorts(data.ports || []);
      setServer(data.server || null);
      setLastUpdated(new Date());
    } catch (e) {
      if (e.name === 'AbortError') showToast('error', t('toastTimeout'));
      else showToast('error', t('toastRefresh', { msg: e.message }));
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
  }, [showToast, t]);

  // 首次加载
  useEffect(() => { fetchPorts(); }, [fetchPorts]);

  // 定时自动刷新
  useEffect(() => {
    if (timerRef.current) clearInterval(timerRef.current);
    const secs = Number(auto);
    if (secs > 0) {
      timerRef.current = setInterval(() => fetchPorts({ silent: true }), secs * 1000);
    }
    return () => { if (timerRef.current) clearInterval(timerRef.current); };
  }, [auto, fetchPorts]);

  async function handleAdd(e) {
    e.preventDefault();
    const port = Number(newPort);
    if (!Number.isInteger(port) || port < 1 || port > 65535) {
      showToast('error', t('toastInvalid'));
      return;
    }
    try {
      const res = await fetch('/api/ports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ port }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.error) || 'HTTP ' + res.status);
      setNewPort('');
      showToast('success', t('toastAdded', { port }));
      fetchPorts();
    } catch (err) {
      showToast('error', t('toastAddFail', { msg: err.message }));
    }
  }

  async function handleDelete(port) {
    if (!window.confirm(t('confirmRemove', { port }))) return;
    try {
      const res = await fetch('/api/ports/' + port, { method: 'DELETE' });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.error) || 'HTTP ' + res.status);
      showToast('success', t('toastRemoved', { port }));
      fetchPorts();
    } catch (err) {
      showToast('error', t('toastDeleteFail', { msg: err.message }));
    }
  }

  async function handleKill(port) {
    if (!window.confirm(t('confirmKill', { port }))) return;
    setBusyPort(port);
    try {
      const res = await fetch('/api/kill/' + port, { method: 'POST' });
      const data = await res.json().catch(() => null);
      if (res.ok) {
        showToast('success', t('toastReleased', { port }));
      } else {
        const errText = (data && data.error) || t('toastKillFail', { port });
        if (lang === 'en') {
          if (data && data.still && data.still.length) {
            const still = data.still.map(p => `${p.name}(${p.pid})`).join(', ');
            showToast('error', t('killStill', { port, still }));
          } else if (errText.indexOf('本工具自身') !== -1) {
            showToast('error', t('selfProtect', { port }));
          } else {
            showToast('error', t('toastKillFail', { port }) + ' — ' + errText);
          }
        } else {
          showToast('error', errText);
        }
      }
      fetchPorts();
    } catch (err) {
      showToast('error', t('toastOpFail', { msg: err.message }));
    } finally {
      setBusyPort(null);
    }
  }

  const occupied = ports.filter(p => p.occupied).length;
  const free = ports.length - occupied;

  return (
    <div className="wrap">
      <header className="top">
        <div className="brand">
          <span className="logo">🛠️</span>
          <div>
            <h1>Dev Port Manager</h1>
            <p className="sub">
              {server
                ? <span className="mono">localhost:{server.port} · PID {server.pid}</span>
                : t('subFallback')}
              {lastUpdated && <span className="updated">{t('subUpdated', { time: lastUpdated.toLocaleTimeString() })}</span>}
            </p>
          </div>
        </div>
        <div className="stats">
          <div className="stat"><b>{ports.length}</b><span>{t('statTotal')}</span></div>
          <div className="stat occ"><b>{occupied}</b><span>{t('statOccupied')}</span></div>
          <div className="stat free"><b>{free}</b><span>{t('statFree')}</span></div>
        </div>
        <button
          className="lang-btn"
          onClick={() => setLang(l => (l === 'zh' ? 'en' : 'zh'))}
          title={lang === 'zh' ? 'Switch to English' : '切换到中文'}
        >{t('langToggle')}</button>
      </header>

      <section className="toolbar">
        <button className="btn" onClick={() => fetchPorts()} disabled={loading || refreshing}>
          <span className={'spin ' + (refreshing ? 'on' : '')}>⟳</span> {t('btnRefresh')}
        </button>
        <label className="select-label">{t('labelAuto')}
          <select value={auto} onChange={e => setAuto(e.target.value)}>
            <option value="0">{t('optOff')}</option>
            <option value="3">{t('opt3')}</option>
            <option value="5">{t('opt5')}</option>
            <option value="10">{t('opt10')}</option>
          </select>
        </label>
        <form className="add" onSubmit={handleAdd}>
          <input
            value={newPort}
            onChange={e => setNewPort(e.target.value.replace(/\D/g, '').slice(0, 5))}
            placeholder={t('inputPlaceholder')}
            inputMode="numeric"
          />
          <button className="btn primary" type="submit" disabled={!newPort}>{t('btnAdd')}</button>
        </form>
      </section>

      {loading && ports.length === 0 ? (
        <div className="empty">{t('emptyChecking')}</div>
      ) : ports.length === 0 ? (
        <div className="empty">{t('emptyAdd')}</div>
      ) : (
        <table className="ptable">
          <thead>
            <tr>
              <th>{t('thPort')}</th><th>{t('thStatus')}</th><th>{t('thProcess')}</th><th>{t('thAction')}</th>
            </tr>
          </thead>
          <tbody>
            {ports.map(p => (
              <tr key={p.port}>
                <td className="port mono">{p.port}</td>
                <td>
                  {p.occupied
                    ? <span className="badge occ">{t('badgeOcc')}</span>
                    : <span className="badge free">{t('badgeFree')}</span>}
                </td>
                <td className="proc">
                  {p.occupied && p.pids.length ? (
                    p.pids.map(pr => (
                      <div className="proc-item" key={pr.pid}
                           title={pr.cmdline ? t('cmdlineTitle', { cmd: pr.cmdline }) : undefined}>
                        <span className="mono">{pr.name}</span>
                        <span className="pid mono">PID {pr.pid}</span>
                        {pr.cmdline && <span className="cmdline mono">{pr.cmdline}</span>}
                      </div>
                    ))
                  ) : <span className="muted">—</span>}
                </td>
                <td className="ops">
                  <button
                    className="btn small danger"
                    disabled={!p.occupied || busyPort === p.port}
                    onClick={() => handleKill(p.port)}
                  >{busyPort === p.port ? t('btnStopping') : t('btnStop')}</button>
                  <button
                    className="btn small ghost"
                    onClick={() => handleDelete(p.port)}
                    title={t('btnDeleteTitle')}
                  >{t('btnDelete')}</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <footer className="foot">
        {t('footA')}<span className="mono">lsof / ss / netstat</span>{t('footB')}
        <span className="mono">ps / tasklist</span>{t('footC')}<br/>
        <em>{t('footD')}</em>
      </footer>

      {toast && (
        <div className={'toast ' + toast.type} key={toast.key}>
          {toast.type === 'error' ? '⚠ ' : '✓ '}{toast.text}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
